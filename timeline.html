<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-Day 타임라인 - 모든 디데이를 한눈에</title>
  <meta name="description" content="저장한 모든 디데이를 타임라인으로 한눈에 확인하세요. 지나간 날과 다가올 날을 시각적으로 관리합니다.">
  <meta name="keywords" content="디데이 타임라인, D-Day 관리, 디데이 모아보기, 일정 타임라인">
  <meta property="og:title" content="D-Day 타임라인 - 모든 디데이를 한눈에">
  <meta property="og:description" content="저장한 모든 디데이를 타임라인으로 한눈에 확인하세요.">
  <link rel="canonical" href="https://dday.github.io/timeline.html">
  <style>
    :root{--bg:#0a0a0a;--card:#141414;--border:#222;--text:#e8e8e8;--text-sub:#777;--accent:#6C63FF;--accent2:#FF6584}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:-apple-system,'Pretendard','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
    header{text-align:center;padding:48px 20px 32px}
    h1{font-size:2rem;font-weight:800;margin-bottom:8px}
    h1 span{color:var(--accent)}
    .header-desc{color:var(--text-sub);font-size:.95rem}
    nav{display:flex;justify-content:center;gap:6px;padding:0 20px;margin-bottom:32px;flex-wrap:wrap}
    nav a{padding:8px 16px;border-radius:20px;background:var(--card);color:var(--text-sub);text-decoration:none;font-size:.85rem;font-weight:600;border:1px solid var(--border);transition:all .2s}
    nav a:hover,nav a.active{background:var(--accent);color:#fff;border-color:var(--accent)}
    .container{max-width:640px;margin:0 auto;padding:0 20px 40px}

    /* 빠른 추가 */
    .add-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:24px}
    .add-row{display:flex;gap:8px;align-items:end}
    .add-group{flex:1}
    .add-group label{display:block;font-size:.75rem;color:var(--text-sub);margin-bottom:4px;font-weight:600}
    .add-group input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem;outline:none}
    .add-group input:focus{border-color:var(--accent)}
    .add-btn{padding:10px 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:.9rem;cursor:pointer;white-space:nowrap}
    .add-btn:hover{opacity:.85}

    /* 타임라인 */
    .timeline-wrap{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:24px}
    .timeline{position:relative;padding-left:28px}
    .timeline::before{content:'';position:absolute;left:9px;top:0;bottom:0;width:2px;background:#222}

    .tl-item{position:relative;margin-bottom:20px}
    .tl-item:last-child{margin-bottom:0}
    .tl-dot{position:absolute;left:-24px;top:4px;width:12px;height:12px;border-radius:50%;border:2px solid #333;background:var(--bg)}
    .tl-item.past .tl-dot{background:var(--text-sub);border-color:var(--text-sub)}
    .tl-item.past{opacity:.5}
    .tl-item.today .tl-dot{background:var(--accent2);border-color:var(--accent2);box-shadow:0 0 8px rgba(255,101,132,.4)}
    .tl-item.future .tl-dot{background:transparent;border:2px dashed var(--accent)}
    .tl-item.now-marker .tl-dot{background:var(--accent);border-color:var(--accent);box-shadow:0 0 10px rgba(108,99,255,.5)}

    .tl-header{display:flex;justify-content:space-between;align-items:center}
    .tl-name{font-weight:700;font-size:.95rem}
    .tl-dday{font-size:.8rem;font-weight:700;color:var(--accent)}
    .tl-dday.past-text{color:var(--text-sub)}
    .tl-date{font-size:.78rem;color:var(--text-sub);margin-top:2px}
    .tl-now-label{font-size:.85rem;color:var(--accent);font-weight:700}
    .tl-delete{background:none;border:none;color:#444;cursor:pointer;font-size:1rem;padding:2px 4px;margin-left:8px}
    .tl-delete:hover{color:var(--accent2)}

    .empty-msg{color:var(--text-sub);font-size:.9rem;text-align:center;padding:32px}

    /* SEO */
    .seo-content{margin-top:48px;padding-top:32px;border-top:1px solid var(--border)}
    .seo-content h2{font-size:1.2rem;margin-bottom:12px}
    .seo-content p{color:var(--text-sub);font-size:.9rem;margin-bottom:16px}
    footer{text-align:center;padding:32px 20px;color:#444;font-size:.8rem}
    .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--accent);color:#fff;padding:12px 24px;border-radius:10px;font-weight:600;font-size:.9rem;transition:transform .3s;z-index:999}
    .toast.show{transform:translateX(-50%) translateY(0)}

    @media(max-width:480px){
      h1{font-size:1.6rem}
      .add-row{flex-direction:column}
    }
  </style>
</head>
<body>
  <header>
    <h1><span>D-Day</span> 타임라인</h1>
    <p class="header-desc">모든 디데이를 한눈에 관리하세요</p>
  </header>
  <nav>
    <a href="index.html">디데이 계산</a>
    <a href="couple.html">커플 / 기념일</a>
    <a href="timeline.html" class="active">타임라인</a>
  </nav>
  <div class="container">
    <!-- 빠른 추가 -->
    <section class="add-section">
      <div class="add-row">
        <div class="add-group">
          <label>이름</label>
          <input type="text" id="addName" placeholder="예: 시험, 여행">
        </div>
        <div class="add-group">
          <label>날짜</label>
          <input type="date" id="addDate">
        </div>
        <button class="add-btn" id="addBtn">추가</button>
      </div>
    </section>

    <!-- 타임라인 -->
    <div class="timeline-wrap">
      <div class="timeline" id="timeline"></div>
      <div class="empty-msg" id="emptyMsg">저장된 디데이가 없습니다.<br>위에서 추가해보세요!</div>
      <div class="share-row" id="shareRow" style="display:none">
        <button class="add-btn" id="saveImageBtn" style="width:100%;margin-top:16px;background:#6C63FF">이미지 저장</button>
      </div>
    </div>

    <article class="seo-content">
      <h2>D-Day 타임라인이란?</h2>
      <p>여러 개의 디데이를 타임라인 형태로 한눈에 확인할 수 있습니다. 지나간 일정과 다가올 일정을 시각적으로 관리하고, 오늘이 어디쯤인지 한눈에 파악하세요.</p>
      <h2>이런 분들에게 추천합니다</h2>
      <p>여러 시험 일정을 관리하는 수험생, 프로젝트 마감을 추적하는 직장인, 여행과 기념일을 한번에 보고 싶은 분들에게 유용합니다.</p>
    </article>
  </div>

  <footer>D-Day 계산기 &copy; 2025</footer>
  <div class="toast" id="toast"></div>
  <canvas id="shareCanvas" style="display:none"></canvas>

  <script>
    const addName = document.getElementById('addName');
    const addDate = document.getElementById('addDate');
    addDate.value = new Date().toISOString().split('T')[0];

    // URL로 공유된 타임라인 복원
    const params = new URLSearchParams(location.search);
    if (params.get('items')) {
      try {
        const shared = JSON.parse(decodeURIComponent(params.get('items')));
        const saved = JSON.parse(localStorage.getItem('ddays') || '[]');
        shared.forEach(item => {
          if (!saved.some(s => s.date === item.date && s.name === item.name)) {
            saved.push({ name: item.name, date: item.date, id: Date.now() + Math.random() * 1000, source: item.source || '' });
          }
        });
        localStorage.setItem('ddays', JSON.stringify(saved));
      } catch(e) {}
    }

    document.getElementById('addBtn').addEventListener('click', addDday);
    addName.addEventListener('keydown', e => { if (e.key === 'Enter') addDday(); });

    // 타임라인 이미지 저장
    document.getElementById('saveImageBtn').addEventListener('click', () => {
      const saved = JSON.parse(localStorage.getItem('ddays') || '[]');
      if (saved.length === 0) return;

      const today = new Date(); today.setHours(0,0,0,0);
      const dayNames = ['일','월','화','수','목','금','토'];
      const sorted = saved.sort((a, b) => new Date(a.date) - new Date(b.date));

      // 오늘 마커 위치 계산
      const items = [];
      let todayInserted = false;
      for (const item of sorted) {
        const target = new Date(item.date + 'T00:00:00');
        const diff = Math.ceil((target - today) / (1000*60*60*24));
        if (!todayInserted && diff >= 0) {
          items.push({ name: '오늘', date: fmtDate(today), day: dayNames[today.getDay()], dday: '', type: 'today' });
          todayInserted = true;
        }
        const ddayText = diff > 0 ? `D-${diff}` : diff === 0 ? 'D-Day' : `D+${Math.abs(diff)}`;
        items.push({ name: item.name, date: fmtDate(target), day: dayNames[target.getDay()], dday: ddayText, type: diff < 0 ? 'past' : diff === 0 ? 'today' : 'future' });
      }
      if (!todayInserted) {
        items.push({ name: '오늘', date: fmtDate(today), day: dayNames[today.getDay()], dday: '', type: 'today' });
      }

      const canvas = document.getElementById('shareCanvas');
      const ctx = canvas.getContext('2d');
      const lineH = 52;
      const padTop = 120;
      const padBot = 80;
      const w = 540;
      const h = padTop + items.length * lineH + padBot;
      canvas.width = w;
      canvas.height = h;

      // 배경
      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, '#0f0c29');
      grad.addColorStop(0.5, '#302b63');
      grad.addColorStop(1, '#24243e');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // 타이틀
      ctx.fillStyle = '#6C63FF';
      ctx.font = '800 24px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('D-Day 타임라인', w / 2, 60);

      // 세로선
      const lineX = 60;
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(lineX, padTop - 10);
      ctx.lineTo(lineX, padTop + items.length * lineH - 20);
      ctx.stroke();

      // 아이템
      ctx.textAlign = 'left';
      items.forEach((item, i) => {
        const y = padTop + i * lineH;

        // 점
        ctx.beginPath();
        ctx.arc(lineX, y + 8, 6, 0, Math.PI * 2);
        if (item.type === 'today') {
          ctx.fillStyle = '#6C63FF';
          ctx.fill();
          ctx.shadowColor = 'rgba(108,99,255,0.5)';
          ctx.shadowBlur = 8;
          ctx.fill();
          ctx.shadowBlur = 0;
        } else if (item.type === 'past') {
          ctx.fillStyle = '#555';
          ctx.fill();
        } else {
          ctx.fillStyle = 'transparent';
          ctx.strokeStyle = '#6C63FF';
          ctx.lineWidth = 2;
          ctx.setLineDash([3, 3]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        // 이름
        const alpha = item.type === 'past' ? 0.5 : 1;
        ctx.globalAlpha = alpha;
        ctx.fillStyle = item.type === 'today' && item.name === '오늘' ? '#6C63FF' : '#e8e8e8';
        ctx.font = '700 15px -apple-system, sans-serif';
        ctx.fillText(item.name, lineX + 24, y + 6);

        // 날짜
        ctx.fillStyle = '#777';
        ctx.font = '400 12px -apple-system, sans-serif';
        ctx.fillText(`${item.date} (${item.day})`, lineX + 24, y + 24);

        // D-day
        if (item.dday) {
          ctx.textAlign = 'right';
          ctx.fillStyle = item.type === 'past' ? '#555' : '#6C63FF';
          ctx.font = '700 14px -apple-system, sans-serif';
          ctx.fillText(item.dday, w - 40, y + 12);
          ctx.textAlign = 'left';
        }
        ctx.globalAlpha = 1;
      });

      // 워터마크
      ctx.fillStyle = '#444';
      ctx.font = '400 12px -apple-system, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('D-Day 계산기', w / 2, h - 30);

      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'dday-timeline.png';
        a.click();
        URL.revokeObjectURL(url);
        showToast('이미지가 저장되었습니다!');
      });
    });

    function addDday() {
      const name = addName.value.trim();
      const date = addDate.value;
      if (!name || !date) { showToast('이름과 날짜를 입력해주세요'); return; }

      const saved = JSON.parse(localStorage.getItem('ddays') || '[]');
      if (saved.some(s => s.date === date && s.name === name)) { showToast('이미 저장된 디데이입니다'); return; }
      saved.push({ name, date, id: Date.now() });
      localStorage.setItem('ddays', JSON.stringify(saved));
      addName.value = '';
      renderTimeline();
      showToast('추가되었습니다!');
    }

    function deleteDday(id) {
      const saved = JSON.parse(localStorage.getItem('ddays') || '[]');
      localStorage.setItem('ddays', JSON.stringify(saved.filter(s => s.id !== id)));
      renderTimeline();
    }

    function renderTimeline() {
      const saved = JSON.parse(localStorage.getItem('ddays') || '[]');
      const timeline = document.getElementById('timeline');
      const emptyMsg = document.getElementById('emptyMsg');

      const shareRow = document.getElementById('shareRow');
      if (saved.length === 0) {
        timeline.innerHTML = '';
        emptyMsg.style.display = '';
        shareRow.style.display = 'none';
        return;
      }
      emptyMsg.style.display = 'none';
      shareRow.style.display = '';

      const today = new Date(); today.setHours(0,0,0,0);
      const dayNames = ['일','월','화','수','목','금','토'];
      const sorted = saved.sort((a, b) => new Date(a.date) - new Date(b.date));

      let html = '';
      let todayInserted = false;

      for (const item of sorted) {
        const target = new Date(item.date + 'T00:00:00');
        const diff = Math.ceil((target - today) / (1000*60*60*24));
        const isPast = diff < 0;
        const isToday = diff === 0;

        if (!todayInserted && !isPast) {
          html += `<div class="tl-item now-marker">
            <div class="tl-dot"></div>
            <div class="tl-now-label">오늘</div>
            <div class="tl-date">${fmtDate(today)} (${dayNames[today.getDay()]})</div>
          </div>`;
          todayInserted = true;
        }

        const cls = isToday ? 'today' : isPast ? 'past' : 'future';
        const ddayText = diff > 0 ? `D-${diff}` : diff === 0 ? 'D-Day' : `D+${Math.abs(diff)}`;

        html += `<div class="tl-item ${cls}">
          <div class="tl-dot"></div>
          <div class="tl-header">
            <span class="tl-name">${item.name}</span>
            <span style="display:flex;align-items:center">
              <span class="tl-dday ${isPast ? 'past-text' : ''}">${ddayText}</span>
              <button class="tl-delete" onclick="deleteDday(${item.id})">&#x2715;</button>
            </span>
          </div>
          <div class="tl-date">${fmtDate(target)} (${dayNames[target.getDay()]})</div>
        </div>`;
      }

      if (!todayInserted) {
        html += `<div class="tl-item now-marker">
          <div class="tl-dot"></div>
          <div class="tl-now-label">오늘</div>
          <div class="tl-date">${fmtDate(today)} (${dayNames[today.getDay()]})</div>
        </div>`;
      }

      timeline.innerHTML = html;
    }

    function fmtDate(d) {
      return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1500);
    }

    renderTimeline();
  </script>
</body>
</html>
